name: Excel KPI settimanali

on:
  schedule:
    # Ogni lunedi alle 09:00 UTC (10:00 o 11:00 in Italia secondo l'ora legale):
    # a quell'ora la domenica appena chiusa e' completa anche per l'account USA.
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

# Stesso gruppo del workflow orario: i due non girano mai insieme e non si pestano i commit.
concurrency:
  group: kcb-data
  cancel-in-progress: false

jobs:
  weekly-excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa dipendenze
        run: npm install axios csv-parse exceljs

      - name: Scarica nuovi dati sellerboard (report Prodotti)
        run: node scripts/cloud_import.mjs
        env:
          EU_PRODUCTS_URL: ${{ secrets.EU_PRODUCTS_URL }}
          US_PRODUCTS_URL: ${{ secrets.US_PRODUCTS_URL }}

      - name: Scarica il report P&L (per calibrare il Net profit)
        run: node scripts/cloud_import_pnl.mjs
        env:
          EU_PROFIT_URL: ${{ secrets.EU_PROFIT_URL }}
          US_PROFIT_URL: ${{ secrets.US_PROFIT_URL }}

      - name: Ricostruisci la dashboard
        run: node scripts/cloud_build.mjs

      - name: Genera l'Excel dei KPI settimanali
        run: node scripts/weekly_excel.mjs

      - name: Commit e push se ci sono cambiamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/pnl.json docs/index.html docs/KPI_settimanali.xlsx
          git diff --staged --quiet || git commit -m "KPI settimanali $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
